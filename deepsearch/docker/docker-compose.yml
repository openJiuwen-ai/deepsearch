# openJiuwen-DeepSearch 最小化一键部署
#
# 包含 deepsearch（主后端 8000 / Telemetry 8089），满足 DeepResearch 与 DeepSearch
# 快速体验需求（sqlite + in_memory）。
#
# ⚠️ 配置文件位置说明:
#   📁 deepsearch/
#     ├── 📁 docker/
#     │   ├── .env            ← 必须在这里 (从 ../.env.example 复制)
#     │   ├── docker-compose.yml
#     │   └── docker-compose.full.yml
#     └── .env.example        ← 模板文件
#
# 用法（在本目录下执行）：
#   cd deepsearch/docker
#   cp ../.env.example .env       # 再编辑 .env 填入 LLM / 搜索密钥（在 docker/ 目录）
#   docker compose up -d
#
# 说明：最小栈仅提供 SQLite 元数据 + in_memory 会话（重启丢会话），
# 不包含 Redis/MySQL/Milvus；知识库（INDEX_MANAGER_TYPE=milvus）需要外接 Milvus，
# 否则请勿调用知识库相关接口。
# 完整栈（MySQL + Milvus 单机生产）参见 docker-compose.full.yml，
# 分布式（Redis 多实例会话共享）参见 docker-compose.distributed.yml。

services:
  deepsearch:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
      - "8089:8089"
    environment:
      # 固定后端端口为 8000，与 docker/Dockerfile 的 EXPOSE/HEALTHCHECK 保持一致
      # （.env.example 中 BACKEND_PORT=6000 面向本地源码运行，容器内以 8000 为准）
      BACKEND_PORT: "8000"
      HOST: "0.0.0.0"
      # 最小栈：显式强制 sqlite + in_memory（防止被 .env 中的其他配置覆盖）
      DB_TYPE: sqlite
      CHECKPOINTER_TYPE: in_memory
    env_file:
      - .env
    volumes:
      - ../output:/app/output
      - ../data:/app/data
    restart: unless-stopped