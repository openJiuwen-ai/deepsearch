# openJiuwen-DeepSearch 分布式一键部署
#
# 多实例水平扩展：Redis 会话共享 + MySQL 共享元数据 + Milvus 向量库 + MinIO 对象存储（KB 文件共享）。
# CHECKPOINTER_TYPE=redis 时，所有实例必须连接同一 MySQL（元数据）和 OBS（KB 文件），才能保证状态一致。
#
# ⚠️ 生产环境安全提示（部署前必读）:
#    1. 必须修改默认密码:
#       - DB_PASSWORD (MySQL root 密码，默认 'root')
#       - MINIO_ROOT_USER / MINIO_ROOT_PASSWORD (MinIO 凭证，默认 'minioadmin')
#    2. 端口暴露策略:
#       - 基础设施端口已绑定 127.0.0.1 (MySQL 3306, Redis 6379, Milvus 19530, MinIO 9000/9001)
#       - 业务端口 8000/8089 需配置防火墙/安全组限制访问
#    3. 生产环境建议使用外部托管数据库、Redis 和对象存储服务
#
# ⚠️ 配置文件位置说明:
#   📁 deepsearch/
#     ├── 📁 docker/
#     │   ├── .env            ← 必须在这里 (从 ../.env.example 复制)
#     │   ├── docker-compose.yml
#     │   └── docker-compose.distributed.yml
#     └── .env.example        ← 模板文件
#
# 用法（在本目录下执行）：
#   cd deepsearch/docker
#   cp ../.env.example .env   # 填入 LLM / 搜索密钥；DB_PASSWORD 即 MySQL root 密码
#   docker compose -f docker-compose.distributed.yml up -d --scale deepsearch=3
#
# 说明：
# - MinIO 在本编排中承担双重角色:
#   1. Milvus 内部对象存储 (etcd + minio 是 Milvus standalone 标配依赖)
#   2. DeepSearch OBS (KB 文件共享，bucket: deepsearch-kb，由 minio-init 自动创建)
# - nginx 反向代理负载均衡到 N 个 deepsearch 实例（least_conn 策略）。
# - 外部通过宿主机 8000/8089 访问，nginx 将请求分发到容器内各实例。
# - 生产环境可改用外部托管 OBS（华为云 OBS / AWS S3 等），修改 OBS_SERVER 和凭据即可。
#
# 首次多实例启动：docker compose -f docker-compose.distributed.yml up -d --scale deepsearch=N
# 对运行中的栈扩缩容后，须重建 nginx 以刷新 upstream 地址：
# docker compose -f docker-compose.distributed.yml up -d --scale deepsearch=N --force-recreate nginx

services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: ${DEEPSEARCH_DB_NAME:-openjiuwen_deepsearch}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd-data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-09-13T14-41-40Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.4.15
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 90s
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      if ! mc ls myminio/${OBS_BUCKET:-deepsearch-kb} >/dev/null 2>&1; then
        mc mb myminio/${OBS_BUCKET:-deepsearch-kb};
        echo 'Bucket ${OBS_BUCKET:-deepsearch-kb} created';
      else
        echo 'Bucket ${OBS_BUCKET:-deepsearch-kb} already exists';
      fi;
      "
    restart: "no"

  deepsearch:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      BACKEND_PORT: "8000"
      HOST: "0.0.0.0"
      # 分布式栈：Redis 会话 + MySQL 元数据 + Milvus 向量库 + MinIO 对象存储（KB 文件共享）
      DB_TYPE: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DEEPSEARCH_DB_NAME: ${DEEPSEARCH_DB_NAME:-openjiuwen_deepsearch}
      CHECKPOINTER_TYPE: redis
      REDIS_URL: redis://redis:6379
      INDEX_MANAGER_TYPE: milvus
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
      MILVUS_TOKEN: ""
      # MinIO 作为知识库文件的对象存储（Redis 分布式模式必需）
      OBS_SERVER: http://minio:9000
      # Docker 网络中 MinIO 使用 path-style，避免 bucket 子域名无法被服务 DNS 解析。
      OBS_ADDRESSING_STYLE: path
      OBS_REGION: us-east-1
      OBS_BUCKET: ${OBS_BUCKET:-deepsearch-kb}
      OBS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      OBS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      milvus:
        condition: service_healthy
    volumes:
      - deepsearch-output:/app/output
      - deepsearch-data:/app/data
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8000:8000"
      - "8089:8089"
    volumes:
      - ./nginx-distributed.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      deepsearch:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
  etcd-data:
  minio-data:
  milvus-data:
  deepsearch-output:
  deepsearch-data: