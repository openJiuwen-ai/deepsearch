events {
    worker_connections 1024;
}

http {
    upstream deepsearch_backend {
        least_conn;
        server deepsearch:8000 max_fails=3 fail_timeout=30s;
    }

    upstream deepsearch_telemetry {
        least_conn;
        server deepsearch:8089 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 8000;
        client_max_body_size 100m;
        location / {
            proxy_pass http://deepsearch_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }

    server {
        listen 8089;
        location / {
            proxy_pass http://deepsearch_telemetry;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }
    }
}
