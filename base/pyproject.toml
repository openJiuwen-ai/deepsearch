[project]
name = "openjiuwen-search-base"
# 版本号与同系列产品保持同步发布
version = "0.2.0"
description = "Shared building blocks for openJiuwen search products (transitional; extracted from codesearch)."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.5",
]

# openjiuwen 的传递依赖含预发布版本（a2a-sdk），解析时需放行
[tool.uv]
prerelease = "allow"

[project.optional-dependencies]
# 与消费方相同的分组模式：核心零重依赖，按需启用。
# 已验证该版本同时提供 foundation.llm 与 workflow/Runner 两组 API
workflow = ["openjiuwen", "certifi"]  # certifi 为 SSL 默认 CA 包
milvus = ["pymilvus>=2.4,<3"]  # 已验证组合：客户端 2.6.x + 服务端 v2.6.18；≥2.5 才有 BM25 Function
embed = ["aiohttp>=3.9"]

# CI 依赖组（PEP 735）：供流水线 `uv sync --group ci`。
[dependency-groups]
ci = [
    "pytest>=8",
    "pytest-cov>=6",
    "pytest-html>=4",
    "coverage>=7",
    "python-dotenv",
]

[tool.coverage.run]
source = ["openjiuwen_search_base"]
omit = ["*/tests/*"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["openjiuwen_search_base*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["-ra", "-q"]
markers = [
    "system: requires the workflow extra (openjiuwen) and/or live services",
]
