[project]
name = "openjiuwen-codesearch"
# 版本号与同系列产品保持同步发布
version = "0.2.0"
description = "Agentic code retrieval built on the openJiuwen agent-core framework."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.5",
    "python-dotenv>=1.0",
    "openjiuwen-search-base[workflow,milvus,embed]==0.2.*",
]

[tool.uv]
prerelease = "allow"

[tool.uv.sources]
openjiuwen-search-base = { path = "../base", editable = true }

[project.optional-dependencies]
# Heavy integrations are opt-in so the core SDK stays installable and unit-testable anywhere.
milvus = ["pymilvus>=2.4,<3"]  # 已验证组合：客户端 2.6.x + 服务端 v2.6.18；≥2.5 才有 BM25 Function
embed = ["aiohttp>=3.9"]
llm = ["openjiuwen==0.1.10.post3"]
bench = [
    "pandas>=2.0",
    "pyarrow>=14",
    "tree-sitter==0.25.2",
    "tree-sitter-language-pack==1.12.5",
]
# tree-sitter 两个 pin 必须与 bench 一致，否则 `[bench,retropus]` 无法共存。
retropus = [
    "tree-sitter==0.25.2",
    "tree-sitter-language-pack==1.12.5",
    "igittigitt>=2.1.5",
    "bm25s>=0.2.0",
]
dev = ["pytest>=8"]
server = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic-settings>=2.5"]

[project.scripts]
codesearch = "openjiuwen_codesearch.cli:main"
codesearch-server = "openjiuwen_codesearch.server.main:main"

[dependency-groups]
ci = [
    "pytest>=8",
    "pytest-cov>=6",
    "pytest-html>=4",
    "coverage>=7",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "openjiuwen-search-base[codegraph,ladybug]",
]

[build-system]
requires = ["setuptools>=62.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["openjiuwen_codesearch*"]

[tool.setuptools.package-data]
openjiuwen_codesearch = ["algorithm/prompts/**/*.md"]

[tool.coverage.run]
source = ["openjiuwen_codesearch"]
omit = ["*/tests/*", "*/benchmarks/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["-ra", "-q"]
markers = [
    "e2e: requires a running Milvus instance / external services",
    "integration: requires optional heavy dependencies (openjiuwen, pymilvus)",
]
