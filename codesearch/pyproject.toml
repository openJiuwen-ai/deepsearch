[project]
name = "openjiuwen-codesearch"
# 版本号与 deepsearch 保持同步（leader 2026-07-29 裁决：release notes 随整体项目发布）
version = "0.2.0"
description = "Agentic code retrieval built on the openJiuwen agent-core framework."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.5",
    # search 场景公共能力（同仓 base/ 过渡包；开发期经 uv workspace 解析，
    # 纯 pip 场景先 `pip install -e ../base` 再装本包）。
    # ⚠️ 发布前置条件：base 须一并发布到同一索引源（或 vendor 进发布物），
    # 否则 wheel 元数据中的本依赖将无法解析——见 base/README "发布前 TODO"。
    "openjiuwen-search-base[workflow,milvus,embed]==0.1.*",
]

# path 源而非 workspace：uv workspace 的共享 lock 要求全成员依赖可共同解析，
# 与 leader "两产品框架版本各自演进"的裁决结构性冲突（deepsearch 锁 PyPI
# 0.1.10.post3 vs 本包 llm extra 的 gitcode v0.1.13 直引不可共解析）。
# 各产品独立解析；base 经相对路径共享。
[tool.uv]
# openjiuwen 传递依赖含预发布版本（a2a-sdk），uv 解析需放行
prerelease = "allow"

[tool.uv.sources]
openjiuwen-search-base = { path = "../base", editable = true }

[project.optional-dependencies]
# Heavy integrations are opt-in so the core SDK stays installable and unit-testable anywhere.
milvus = ["pymilvus>=2.4,<3"]  # 已验证组合：客户端 2.6.x + 服务端 v2.6.18；≥2.5 才有 BM25 Function
embed = ["aiohttp>=3.9"]
# spike 已验证该版本两个 API 面（foundation.llm 与 workflow/Runner）齐备，
# 图化引擎全量测试通过；PyPI openjiuwen==0.1.10.post3 亦兼容，可随时切换。
llm = ["openjiuwen @ git+https://gitcode.com/openJiuwen/agent-core.git@v0.1.13"]
bench = ["pandas>=2.0", "pyarrow>=14"]
dev = ["pytest>=8"]

[project.scripts]
codesearch = "openjiuwen_codesearch.cli:main"

[build-system]
requires = ["setuptools>=62.3"]  # package-data 的 ** 递归 glob 需要 62.3+
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["openjiuwen_codesearch*"]

[tool.setuptools.package-data]
# 递归收录，防止 prompts 增设子目录后被 wheel 漏掉
openjiuwen_codesearch = ["algorithm/prompts/**/*.md"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["-ra", "-q"]
markers = [
    "e2e: requires a running Milvus instance / external services",
    "integration: requires optional heavy dependencies (openjiuwen, pymilvus)",
]
